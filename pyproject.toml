[project]
name = "onshape-rest-api-client"
version = "1.223.1"
description = "A heavyweight python client library for accessing the Onshape REST API"
license = "MIT"
license-files = [
    "LICENSE"
]
readme = "README.md"
authors = [ 
    {name="Mark Chackerian"},
]
keywords = ["onshape"]
requires-python = ">=3.11,<4.0"
dependencies = [
    "attrs>=22.2.0",
    "httpx2>=2.13.1,<3",
]

[project.urls]
repository = "https://github.com/quarter20/onshape-rest-api-client"
changelog = "https://github.com/quarter20/onshape-rest-api-client/blob/main/CHANGELOG.md"
issues = "https://github.com/quarter20/onshape-rest-api-client/issues"

[tool.poetry]
packages = [
    { include = "onshape_rest_api_client" },
]
include = ["onshape_rest_api_client/py.typed"]

[build-system]
requires = ["poetry-core>=2.0.0,<3.0.0"]
build-backend = "poetry.core.masonry.api"

[tool.ruff]
line-length = 120

[tool.ruff.lint]
select = ["F", "I", "UP"]
